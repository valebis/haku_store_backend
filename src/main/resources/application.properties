spring.application.name=hakustore

logging.level.root=info
logging.level.com.betacom=debug

logging.pattern.console=  %d{"yyyy/MM/dd HH:mm:ss,SSS"} [%p] [%t] %M\\(%F:%L\\) - %msg%n
logging.file.name=./jpa.log

server.port=9090
spring.datasource.url=${db_url}
spring.datasource.username=${db_user}
spring.datasource.password=${db_pwd}

spring.jpa.show-sql = false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.hbm2ddl.schema-generation.script.append=false

spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=drop-and-create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=define.sql
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.drop-target=drop.sql

lang=IT

jwt.secret=${jwt_secret}
jwt.expiration-ms=${jwt_expiration_ms:3600000}

# Recupero password. Configurare le variabili SMTP nell'ambiente di produzione.
spring.mail.host=${mail_host:localhost}
spring.mail.port=${mail_port:1025}
spring.mail.username=${mail_username:}
spring.mail.password=${mail_password:}
spring.mail.properties.mail.smtp.auth=${mail_smtp_auth:false}
spring.mail.properties.mail.smtp.starttls.enable=${mail_starttls:false}
app.mail.from=${mail_from:noreply@hakustore.local}
app.password-reset.url=${password_reset_url:http://localhost:4200/reset-password}
app.password-reset.expiration-minutes=${password_reset_expiration_minutes:30}

# cartella su disco dove vengono salvate le immagini delle categorie
upload.dir.categorie=uploads/categorie
# cartella su disco dove viene salvato il logo del sito (un solo file, sempre chiamato "logo.<estensione>")
upload.dir.logo=uploads/logo
# cartella su disco dove vengono salvate le immagini dei prodotti
upload.dir.prodotti=uploads/prodotti
# cartella su disco dove vengono salvate le immagini delle varianti prodotto
upload.dir.varianti=uploads/varianti
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
