spring.application.name=hakustore

logging.level.root=info
logging.level.com.betacom=debug

logging.pattern.console=  %d{"yyyy/MM/dd HH:mm:ss,SSS"} [%p] [%t] %M\\(%F:%L\\) - %msg%n
logging.file=./jpa.log

spring.datasource.url=jdbc:h2:mem:dbJPA
spring.datasource.driver=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create


spring.jpa.show-sql = false

spring.jpa.properties.hibernate.format_sql=true

lang=IT

jwt.secret=test-secret-key-not-for-production-use-only-for-local-tests-0123456789
jwt.expiration-ms=3600000

app.mail.from=noreply@hakustore.test
app.password-reset.url=http://localhost:4200/reset-password
app.password-reset.expiration-minutes=30

upload.dir.categorie=target/test-uploads/categorie
upload.dir.logo=target/test-uploads/logo
upload.dir.prodotti=target/test-uploads/prodotti
upload.dir.varianti=target/test-uploads/varianti
